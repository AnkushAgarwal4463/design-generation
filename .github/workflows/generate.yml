
name: Systolic Array Circuit and Schematic Generation

on:
  workflow_dispatch:
    inputs:
      array_rows:
        description: "Array rows"
        required: true
        type: choice
        default: "2"
        options: ["2", "4", "8"]
      array_cols:
        description: "Array columns"
        required: true
        type: choice
        default: "2"
        options: ["2", "4", "8"]
      data_width:
        description: "Data width in bits"
        required: true
        type: choice
        default: "4"
        options: ["4", "8"]
      utilization:
        description: "Target utilization (%)"
        required: true
        type: choice
        default: "20"
        options: ["20", "30", "40", "50", "60", "70"]
      clock_period:
        description: "Clock period (ns)"
        required: true
        type: choice
        default: "10"
        options: ["10", "15", "20", "25", "30", "35"]

permissions:
  contents: read

jobs:
  generate-schematic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 yosys graphviz

      - name: Check tools
        run: |
          python3 --version
          yosys -V
          dot -V

      - name: Display configuration
        run: |
          echo "Array: ${{ inputs.array_rows }}x${{ inputs.array_cols }}"
          echo "Data width: ${{ inputs.data_width }} bits"
          echo "Utilization: ${{ inputs.utilization }}%"
          echo "Clock period: ${{ inputs.clock_period }} ns"

      - name: Explain required integration
        run: |
          echo "This workflow needs the original OpenROAD flow's"
          echo "RTL generator, SKY130 library, and synthesis scripts."
          echo "Do not synthesize a different design and label it"
          echo "with these parameters."
          echo "See the workflow summary for required integration."

      - name: Workflow summary
        run: |
          {
            echo "## Requested circuit configuration"
            echo "- Array: ${{ inputs.array_rows }}x${{ inputs.array_cols }}"
            echo "- Data width: ${{ inputs.data_width }} bits"
            echo "- Utilization: ${{ inputs.utilization }}%"
            echo "- Clock period: ${{ inputs.clock_period }} ns"
            echo
            echo "This workflow currently records the configuration only."
            echo "Integrate the original OpenROAD synthesis and RTL flow"
            echo "before treating a generated schematic as a real result."
          } >> "$GITHUB_STEP_SUMMARY"
