
name: Systolic Array Design Generation

on:
  workflow_dispatch:
    inputs:
      array_rows:
        description: "Array rows"
        required: true
        type: choice
        options: ["2", "4", "8"]
        default: "2"

      array_cols:
        description: "Array columns"
        required: true
        type: choice
        options: ["2", "4", "8"]
        default: "2"

      data_width:
        description: "Data width"
        required: true
        type: choice
        options: ["4", "8"]
        default: "4"

      utilization:
        description: "Utilization (%) - metadata only"
        required: true
        type: choice
        options: ["20", "30", "40", "50", "60", "70"]
        default: "20"

      clk_period:
        description: "Clock period (ns) - metadata only"
        required: true
        type: choice
        options: ["10", "15", "20", "25", "30", "35"]
        default: "10"

  push:
    paths:
      - "systolic-array-circuit-generator/**"
      - ".github/workflows/generate.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  generate-and-synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python, Yosys, Graphviz, Matplotlib, and SKY130
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: systolic-env
          create-args: >-
            -c conda-forge
            -c litex-hub
            python=3.11
            matplotlib
            yosys
            graphviz
            open_pdks.sky130a

      - name: Verify tools and locate SKY130 HD Liberty
        run: |
          set -euo pipefail

          python --version
          yosys -V
          dot -V

          PDK_DIR="$CONDA_PREFIX/share/pdk/sky130A"

          LIB_FILE=$(find "$PDK_DIR/libs.ref/sky130_fd_sc_hd/lib" \
            -type f \
            -name 'sky130_fd_sc_hd__tt_025C_1v80.lib' \
            -print -quit)

          if [ -z "$LIB_FILE" ] || [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: Expected SKY130 HD Liberty file not found."
            echo "Available HD Liberty files:"
            find "$PDK_DIR/libs.ref/sky130_fd_sc_hd/lib" \
              -type f -name '*.lib' -print
            exit 1
          fi

          echo "SKY130_LIB=$LIB_FILE" >> "$GITHUB_ENV"
          echo "Found SKY130 HD Liberty: $LIB_FILE"
          
      - name: Generate, synthesize, and visualize selected design
        working-directory: systolic-array-circuit-generator
        env:
          ARRAY_ROWS: ${{ github.event.inputs.array_rows || '2' }}
          ARRAY_COLS: ${{ github.event.inputs.array_cols || '2' }}
          DATA_WIDTH: ${{ github.event.inputs.data_width || '4' }}
          UTIL: ${{ github.event.inputs.utilization || '20' }}
          CLK_PERIOD: ${{ github.event.inputs.clk_period || '10' }}
        run: |
          set -euo pipefail

          echo "Selected configuration:"
          echo "Rows: $ARRAY_ROWS"
          echo "Columns: $ARRAY_COLS"
          echo "Data width: $DATA_WIDTH"
          echo "Utilization: $UTIL%"
          echo "Clock period: $CLK_PERIOD ns"
          echo "SKY130 library: $SKY130_LIB"

          python scripts/run_all.py

      - name: Upload generated RTL, netlists, statistics, and schematics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systolic-array-designs-and-visualizations
          path: |
            systolic-array-circuit-generator/generated/
            systolic-array-circuit-generator/outputs/
          if-no-files-found: warn
          retention-days: 30

