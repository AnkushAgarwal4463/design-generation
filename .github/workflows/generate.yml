
name: Systolic Array Design Generation

on:
  workflow_dispatch:
    inputs:
      array_rows:
        description: 'Array rows'
        required: true
        type: choice
        options:
          - '2'
          - '4'
          - '8'
        default: '2'

      array_cols:
        description: 'Array columns'
        required: true
        type: choice
        options:
          - '2'
          - '4'
          - '8'
        default: '2'

      data_width:
        description: 'Data width'
        required: true
        type: choice
        options:
          - '4'
          - '8'
        default: '4'

      utilization:
        description: 'Utilization (%)'
        required: true
        type: choice
        options:
          - '20'
          - '30'
          - '40'
          - '50'
          - '60'
          - '70'
        default: '20'

      clk_period:
        description: 'Clock period'
        required: true
        type: choice
        options:
          - '10'
          - '15'
          - '20'
          - '25'
          - '30'
          - '35'
        default: '10'

  push:
    paths:
      - 'systolic-array-circuit-generator/**'
      - '.github/workflows/generate.yml'

permissions:
  contents: read

jobs:
  generate-and-synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python, Yosys, Graphviz, and Matplotlib
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-matplotlib \
            yosys \
            graphviz

      - name: Check tool versions
        run: |
          python3 --version
          yosys -V
          dot -V

      - name: Generate, synthesize, and visualize all eight designs
        working-directory: systolic-array-circuit-generator
        run: python3 scripts/run_all.py

      - name: Upload generated RTL, synthesis results, and schematics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systolic-array-designs-and-visualizations
          path: |
            systolic-array-circuit-generator/generated/
            systolic-array-circuit-generator/outputs/
          if-no-files-found: warn
          retention-days: 30
```
