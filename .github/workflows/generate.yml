name: Systolic Array Design Generation

on:
  workflow_dispatch:
    inputs:
      array_rows:
        description: 'Array rows'
        required: true
        type: choice
        options:
          - '2'
          - '4'
          - '8'
        default: '2'

      array_cols:
        description: 'Array columns'
        required: true
        type: choice
        options:
          - '2'
          - '4'
          - '8'
        default: '2'

      data_width:
        description: 'Data width'
        required: true
        type: choice
        options:
          - '4'
          - '8'
        default: '4'

      utilization:
        description: 'Utilization (%)'
        required: true
        type: choice
        options:
          - '20'
          - '30'
          - '40'
          - '50'
          - '60'
          - '70'
        default: '20'

      clk_period:
        description: 'Clock period (ns)'
        required: true
        type: choice
        options:
          - '10'
          - '15'
          - '20'
          - '25'
          - '30'
          - '35'
        default: '10'

  push:
    paths:
      - 'systolic-array-circuit-generator/**'
      - '.github/workflows/generate.yml'

permissions:
  contents: read

jobs:
  generate-and-synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python, Yosys, Graphviz, Matplotlib, and SKY130 PDK
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: systolic-env
          channels: litex-hub, conda-forge
          create-args: >-
            python=3.11
            matplotlib
            yosys
            graphviz
            open_pdks.sky130a

      - name: Check tools and locate SKY130 library
        run: |
          python --version
          yosys -V
          dot -V

          LIB_FILE=$(find "$CONDA_PREFIX/share/pdk/sky130A" \
            -name 'sky130_fd_sc_hd__tt_025C_5v00.lib' \
            -print -quit)

          if [ -z "$LIB_FILE" ] || [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: SKY130 HD Liberty file was not found."
            echo "PDK directory: $CONDA_PREFIX/share/pdk/sky130A"
            exit 1
          fi

          echo "SKY130_LIB=$LIB_FILE" >> "$GITHUB_ENV"
          echo "Found SKY130 library: $LIB_FILE"

      - name: Generate, synthesize, and visualize selected design
        working-directory: systolic-array-circuit-generator
        env:
          ARRAY_ROWS: ${{ github.event.inputs.array_rows || '2' }}
          ARRAY_COLS: ${{ github.event.inputs.array_cols || '2' }}
          DATA_WIDTH: ${{ github.event.inputs.data_width || '4' }}
          UTIL: ${{ github.event.inputs.utilization || '20' }}
          CLK_PERIOD: ${{ github.event.inputs.clk_period || '10' }}
        run: |
          echo "Selected configuration:"
          echo "Rows: $ARRAY_ROWS"
          echo "Columns: $ARRAY_COLS"
          echo "Data width: $DATA_WIDTH"
          echo "Utilization: $UTIL%"
          echo "Clock period: $CLK_PERIOD ns"

          python scripts/run_all.py

      - name: Upload generated RTL, netlists, statistics, and schematics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systolic-array-designs-and-visualizations
          path: |
            systolic-array-circuit-generator/generated/
            systolic-array-circuit-generator/outputs/
          if-no-files-found: warn
          retention-days: 30
